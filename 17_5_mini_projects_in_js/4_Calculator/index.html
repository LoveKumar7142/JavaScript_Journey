<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>Calculator</title>
    </head>
    <body>
        <section class="main">
            <div class="values">
                0
            </div>
            <div class="numbers">
                <button class="clear" onclick="cleanValues()">C</button>
                <button class="backspace">⌫</button>
                <button class="add" onclick="appendText('+')">+</button>

                <button class="one" onclick="appendText('1')">1</button>
                <button class="two" onclick="appendText('2')">2</button>
                <button class="three" onclick="appendText('3')">3</button>
                <button class="sub" onclick="appendText('-')">-</button>

                <button class="four" onclick="appendText('4')">4</button>
                <button class="five" onclick="appendText('5')">5</button>
                <button class="six" onclick="appendText('6')">6</button>
                <button class="multi" onclick="appendText('*')">*</button>

                <button class="seven" onclick="appendText('7')">7</button>
                <button class="eight" onclick="appendText('8')">8</button>
                <button class="nine" onclick="appendText('9')">9</button>
                <button class="divide" onclick="appendText('/')">/</button>
                <button class="zero" onclick="appendText('0')">0</button>
                <button class="dot" onclick="appendText('.')">.</button>
                <button class="equalto" onclick="equalto()">=</button>
            </div>
        </section>
        <script src="script.js"></script>
    </body>
</html>
