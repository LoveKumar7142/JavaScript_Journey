<!DOCTYPE html>
<html lang="en">
    <head>

        <title>Event Handling</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <h1>Event Handling Most used Events</h1>
        <!-- Event Handling Inline Methods -->
        <button
            onclick="console.log('This is clicked by someone')"
            ondblclick="console.log('This is double clicked by someone')">
            1st button Inline
            Event handling by onclick="" and ondbclick = "" method
        </button>

        <!-- Event Handling Property Method -->
        <button class="secondBtn">2nd Property methods</button>

        <!-- Morden Event Handling by using addEventListner -->
        <button class="thirdBtn">3rd Morden Event Handling</button>

        <!-- Most Used Events -->
        <div class="box"></div>

        <button class="most_used_events">clikc me </button>

        <form>
            <input type="text" name="name" id="name" class="name" placeholder="Enter your name">
            <button type="submit" class="submitBtn">Submit</button>
        </form>

        <script src="script.js"></script>

        <!-- 2nd script -->
        <script src="most_used_events.js"></script>
    </body>
</html>
